<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Love Of My Life</title>
  <link rel="stylesheet" href="flowers.css">
</head>
<body>

<div class="headline">
  <h1>I love you Lisi</h1>
  <p>and every flower here knows it</p>
</div>

<div class="garden" id="garden"></div>

<div class="footer">
  <p class="label">since August 3rd</p>
  <div class="timer" id="timer">
    <div class="unit"><span class="num" id="d">0</span><span class="unit-label">days</span></div>
    <div class="unit"><span class="num" id="h">0</span><span class="unit-label">hours</span></div>
    <div class="unit"><span class="num" id="m">0</span><span class="unit-label">min</span></div>
    <div class="unit"><span class="num" id="s">0</span><span class="unit-label">sec</span></div>
  </div>
</div>

<script src="flowers.js"></script>

</body>
</html>
